name: Biolith CPS Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - work/codex-biolith-cps-20261024/iterator-reuse

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check pinned-source behavioral parity
        run: python -B tests/differential/run.py
      - name: Build NeoForge runtime artifact
        run: bash ./gradlew :neoforge:remapJar --no-daemon --console=plain
      - name: Verify real Mixin field initializer extraction
        run: python -B tests/mixin_initializers/run.py
      - name: Package exact artifact and provenance
        run: python -B tests/differential/package_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: biolith-neoforge-candidate
          path: build/candidate/
          if-no-files-found: error
